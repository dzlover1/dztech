<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f0eadd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#paper)"/>
  <rect x="0" y="0" width="800" height="200" fill="#141414"/>
  <text x="400" y="130" font-family="Georgia, 'Amiri', serif" font-size="64" font-weight="600" fill="#d4af37" text-anchor="middle">مجلة الفن</text>
  <text x="400" y="168" font-family="system-ui, sans-serif" font-size="16" letter-spacing="8" fill="#b8b8b8" text-anchor="middle">AL FANN · EDITION Nº 12</text>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#d4af37" stroke-width="2"/>
  <line x1="60" y1="206" x2="740" y2="206" stroke="#141414" stroke-width="1"/>
  <rect x="60" y="60" width="90" height="48" fill="none" stroke="#d4af37" stroke-width="2"/>
  <text x="105" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#d4af37">#12</text>
  <text x="400" y="300" font-family="Georgia, 'Amiri', serif" font-size="42" font-weight="700" fill="#141414" text-anchor="middle" direction="rtl">فن الخط العربي بين الأصالة والحداثة</text>
  <text x="400" y="330" font-family="system-ui, sans-serif" font-size="14" fill="#6b5a3e" text-anchor="middle" direction="rtl">بقلم: سلمى الخطاط · تصوير: فهد النور</text>
  <line x1="300" y1="356" x2="500" y2="356" stroke="#d4af37" stroke-width="3"/>
  <g transform="translate(60,380)">
    <text x="-15" y="20" text-anchor="end" font-family="'Amiri', serif" font-size="30" fill="#141414" direction="rtl">الخط الكوفي يروي حكاية الحضارة، وكل حرف منه لوحة فنية</text>
    <text x="-15" y="52" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" fill="#6b5a3e" direction="rtl">مقتطف من مقابلة مع أستاذ فنون الخط، د. ياسر الكوفي</text>
  </g>
  <line x1="580" y1="380" x2="580" y2="520" stroke="#141414" stroke-width="1"/>
  <g transform="translate(620,380)">
    <text x="-25" y="20" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f3f" direction="rtl">تُعد زخارف الخطوط العربية من أرقى فنون التصميم التحريري،</text>
    <text x="-25" y="40" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f3f" direction="rtl">حيث تمتزج الأحرف مع الفراغ في تكوين إبداعي متكامل. في هذا</text>
    <text x="-25" y="60" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f3f" direction="rtl">العدد نستعرض أبرز المدارس الخطية، وتطورها التقني، وولادة</text>
    <text x="-25" y="80" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f3f" direction="rtl">طابع عربي عصري يليق بالقرن الحادي والعشرين، مع مقابلات</text>
    <text x="-25" y="100" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#3f3f3f" direction="rtl">حصرية مع مصممين يقودون حركة التصميم العربي في العالم.</text>
  </g>
  <rect x="60" y="540" width="160" height="34" rx="4" fill="#141414"/>
  <text x="70" y="562" font-family="system-ui, sans-serif" font-size="13" fill="#d4af37" letter-spacing="3">PAGE 12 — 2026</text>
  <circle cx="690" cy="556" r="16" fill="#d4af37"/>
  <path d="M684 552 l6 7 l10 -11" stroke="#141414" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>